name: Kali Linux Remote Desktop

on:
  workflow_dispatch:

jobs:
  kali-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Kali Linux with RDP
        run: |
          docker run -d --name kali-desktop -p 3389:3389 kalilinux/kali-rolling bash -c "
            apt update && apt install -y kali-desktop-xfce xrdp net-tools kali-tools-top10
            echo 'rdpuser:Pass1234' | chpasswd
            sed -i '/test -r /d' /etc/xrdp/sesman.ini
            service xrdp start
            tail -f /dev/null
          "

      - name: Install & Run Bore Tunnel (RDP Port 3389)
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          ./bore local 3389 --to bore.pub

      - name: Keep Alive
        run: sleep 21600
        
