name: Kali Linux Remote Desktop

on:
  workflow_dispatch:

jobs:
  kali-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Kali Linux with RDP
        run: |
          docker run -d --name kali --net=host -e PUID=1000 -e PGID=1000 -e TZ=Etc/UTC -e SUBFOLDER=/ lscr.io/linuxserver/kali-linux:latest
          docker exec kali apt-get update
          docker exec kali apt-get install -y kali-tools-top10

      - name: Install & Run Bore Tunnel
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          ./bore local 3389 --to bore.pub

      - name: Keep Alive
        run: sleep 21600
        
