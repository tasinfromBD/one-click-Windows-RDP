name: Kali Linux Remote Desktop

on:
  workflow_dispatch:

jobs:
  kali-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Kali Linux with GUI & Tools
        run: |
          docker run -d --name kali-desktop -p 5901:5901 -p 6080:6080 kalilinux/kali-rolling bash -c "
            apt update && apt install -y kali-desktop-xfce tightvncserver novnc net-tools kali-tools-top10
            mkdir -p ~/.vnc
            echo 'Pass1234' | vncpasswd -f > ~/.vnc/passwd
            chmod 600 ~/.vnc/passwd
            vncserver :1 -geometry 1280x720 -depth 16
            websockify --web /usr/share/novnc/ 6080 localhost:5901
          "

      - name: Install & Run Bore Tunnel
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          ./bore local 6080 --to bore.pub

      - name: Keep Alive
        run: sleep 21600

